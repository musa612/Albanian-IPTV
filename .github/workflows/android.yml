
name: Build Albanian IPTV

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o Albanian-IPTV-source.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Android configuration
        run: |
          cat > Albanian_IPTV_Android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.albanianiptv.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.albanianiptv.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.5.1")
              implementation("androidx.media3:media3-ui:1.5.1")
          }
          EOF

          sed -i 's/^package com\.albanianiptv$/package com.albanianiptv.app/' Albanian_IPTV_Android/app/src/main/java/com/albanianiptv/app/MainActivity.kt

      - name: Build Android APK
        run: gradle -p Albanian_IPTV_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Albanian-IPTV-APK
          path: Albanian_IPTV_Android/app/build/outputs/apk/debug/*.apk
