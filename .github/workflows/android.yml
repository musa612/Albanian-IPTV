name: Build Albanian IPTV

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o Albanian-IPTV-source.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin versions
        run: |
          sed -i '/dependencies {/a\    implementation("com.google.android.material:material:1.12.0")' Albanian_IPTV_Android/app/build.gradle.kts
          sed -i '/android {/a\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }' Albanian_IPTV_Android/app/build.gradle.kts
sed -i 's/singleLine = true/setSingleLine(true)/' Albanian_IPTV_Android/app/src/main/java/com/albanianiptv/app/MainActivity.kt
      - name: Build APK
        run: gradle -p Albanian_IPTV_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Albanian-IPTV-APK
          path: Albanian_IPTV_Android/app/build/outputs/apk/debug/*.apk
