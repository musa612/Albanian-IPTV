name: Build Albanian IPTV

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o Albanian-IPTV-source.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p Albanian_IPTV_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Albanian-IPTV-APK
          path: Albanian_IPTV_Android/app/build/outputs/apk/debug/*.apk
